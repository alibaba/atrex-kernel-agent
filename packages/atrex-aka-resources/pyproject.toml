[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-resources"
version = "0.1.0"
description = "Generic AKA Agent resource host and tool runner"
requires-python = ">=3.10"
dependencies = ["atrex-aka-framework==0.1.0"]

[project.entry-points."aka.commands"]
tools = "aka.resources.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.resources*"]

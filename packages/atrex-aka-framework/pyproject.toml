[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-framework"
version = "0.2.0"
description = "AKA plugin framework, contracts and profile-selected startup"
requires-python = ">=3.10"
dependencies = ["packaging>=23"]

[project.scripts]
aka = "aka.cli:main"

[project.entry-points."aka.commands"]
run = "aka.bootstrap.cli:main"

[project.entry-points."aka.tokens"]
agent = "aka.agent.plugin:AGENT"
executor = "aka.execution.assembly:EXECUTOR"
execution_context = "aka.execution.plugin:EXECUTION_CONTEXT"
measurement_parallelism = "aka.execution.plugin:MEASUREMENT_PARALLELISM"

problem = "aka.task.problem.plugin:PROBLEM"

source = "aka.task.source.plugin:SOURCE"

candidate = "aka.task.candidate_workspace.plugin:CANDIDATE"

evaluator_factory = "aka.evaluation.plugin:EVALUATOR_FACTORY"

evaluation_defaults = "aka.evaluation.plugin:EVALUATION_DEFAULTS"

experiment_factory = "aka.experiment.plugin:EXPERIMENT_FACTORY"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka", "aka.core", "aka.core.*", "aka.contracts", "aka.contracts.*", "aka.bootstrap", "aka.bootstrap.*", "aka.execution", "aka.execution.*", "aka.agent", "aka.agent.*", "aka.task", "aka.task.*", "aka.resources", "aka.resources.*", "aka.evaluation", "aka.evaluation.*", "aka.experiment", "aka.experiment.*"]

[tool.setuptools.package-data]
"aka.agent" = ["*", "**/*"]
"aka.execution" = ["*", "**/*"]
"aka.core" = ["profiles/*.json"]

"aka.task" = ["*", "**/*"]

"aka.resources" = ["*", "**/*"]

"aka.evaluation" = ["*", "**/*"]

"aka.experiment" = ["*", "**/*"]

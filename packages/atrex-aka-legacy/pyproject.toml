[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-legacy"
version = "0.2.0"
description = "AKA Task, Agent, Workflow and Execution implementations"
requires-python = ">=3.10"
dependencies = ["atrex-aka-framework==0.2.0", "packaging>=23"]

[project.entry-points."aka.commands"]
optimize = "aka.legacy.compat.command:main"
workflow = "aka.bootstrap.workflow_cli:main"
execution = "aka.legacy.execution.cli:main"

[project.entry-points."aka.tokens"]
agent = "aka.agent.plugin:AGENT"
workflow = "aka.legacy.workflow.plugin:WORKFLOW"
problem = "aka.legacy.task.problem.plugin:PROBLEM"
source = "aka.legacy.task.source.plugin:SOURCE"
candidate = "aka.legacy.task.candidate_workspace.plugin:CANDIDATE"
evaluator_factory = "aka.legacy.evaluation.plugin:EVALUATOR_FACTORY"
evaluation_defaults = "aka.legacy.evaluation.plugin:EVALUATION_DEFAULTS"
executor = "aka.legacy.execution.assembly:EXECUTOR"
execution_context = "aka.legacy.execution.plugin:EXECUTION_CONTEXT"
measurement_parallelism = "aka.legacy.execution.plugin:MEASUREMENT_PARALLELISM"
experiment_factory = "aka.legacy.experiment.plugin:EXPERIMENT_FACTORY"
canonical_measurement_reader = "aka.legacy.workflow.canonical_reader_plugin:CANONICAL_MEASUREMENT_READER"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.legacy", "aka.legacy.*", "aka.agent", "aka.agent.*"]

[tool.setuptools.package-data]
"*" = ["*", "**/*"]
"aka.legacy.execution" = ["profiles/*.json", "profiles/bundles/*.json"]

"aka.legacy.workflow" = ["profiles/*.json", "profiles/compositions/*.json", "profiles/compositions/bundles/*.json"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-legacy"
version = "0.2.0"
description = "AKA Task, Agent, Workflow and Execution implementations"
requires-python = ">=3.10"
dependencies = ["atrex-aka-framework==0.2.0", "packaging>=23"]

[project.entry-points."aka.commands"]
optimize = "aka.legacy.compat.command:main"
workflow = "aka.bootstrap.workflow_cli:main"
execution = "aka.legacy.execution.cli:main"

[project.entry-points."aka.tokens"]
workflow = "aka.legacy.workflow.plugin:WORKFLOW"
experiment_factory = "aka.legacy.experiment.plugin:EXPERIMENT_FACTORY"
canonical_measurement_reader = "aka.legacy.workflow.canonical_reader_plugin:CANONICAL_MEASUREMENT_READER"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.legacy", "aka.legacy.*"]

[tool.setuptools.package-data]
"*" = ["*", "**/*"]

"aka.legacy.workflow" = ["profiles/*.json", "profiles/compositions/*.json", "profiles/compositions/bundles/*.json"]

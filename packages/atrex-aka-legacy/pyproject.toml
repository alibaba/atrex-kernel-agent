[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-legacy"
version = "0.2.0"
description = "Legacy AKA campaign Workflow"
requires-python = ">=3.10"
dependencies = ["atrex-aka-framework==0.2.0", "packaging>=23"]

[project.entry-points."aka.commands"]
optimize = "aka.bootstrap.workflow_cli:main"
workflow = "aka.bootstrap.workflow_cli:main"
execution = "aka.bootstrap.measurement_cli:main"

[project.entry-points."aka.tokens"]
workflow = "aka.workflow.legacy.plugin:WORKFLOW"
canonical_measurement_reader = "aka.workflow.legacy.canonical_reader_plugin:CANONICAL_MEASUREMENT_READER"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.workflow.legacy", "aka.workflow.legacy.*"]

[tool.setuptools.package-data]
"*" = ["*", "**/*"]

"aka.workflow.legacy" = ["profiles/*.json", "profiles/compositions/*.json", "profiles/compositions/bundles/*.json"]

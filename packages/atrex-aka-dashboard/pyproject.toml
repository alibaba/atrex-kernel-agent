[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-dashboard"
version = "0.3.0"
description = "Optional read-only AKA optimization progress dashboard"
requires-python = ">=3.10"
dependencies = ["atrex-aka-framework==0.3.0", "atrex-aka-light==0.3.0"]


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.dashboard", "aka.dashboard.*", "observability", "observability.*"]

[tool.setuptools.package-data]
"aka.dashboard" = ["static/fonts/*"]

"observability" = ["static/*.html"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-optimization"
version = "0.1.0"
description = "AKA legacy optimizer and default launch profiles"
requires-python = ">=3.10"
dependencies = ["atrex-aka-bootstrap==0.1.0"]

[project.entry-points."aka.commands"]
optimize = "aka.legacy.application.cli:main"

[project.entry-points."aka.tokens"]
agent_sandbox = "aka.legacy.agent_sandbox.tokens:AGENT_SANDBOX"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.legacy", "aka.legacy.*"]

[tool.setuptools.package-data]
"aka.legacy.application" = ["profiles/*.json", "profiles/compositions/*.json", "profiles/compositions/bundles/*.json"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-light"
version = "0.2.0"
description = "Optional managed AKA workflows using the common module interfaces"
requires-python = ">=3.10"
dependencies = ["atrex-aka-legacy==0.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.light", "aka.light.*"]

[tool.setuptools.package-data]
"aka.light.workflow" = ["profiles/*.json", "profiles/compositions/*.json", "profiles/compositions/bundles/*.json", "long_horizon/*.md"]

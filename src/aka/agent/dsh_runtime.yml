# Adapter-owned compatibility settings, applied after the headless profile.
- id: agent-default-model
  config:
    provider: !!js process.env.AKA_DSH_PROVIDER
    model: !!js process.env.AKA_DSH_MODEL
    reasoningEffort: !!js process.env.AKA_DSH_REASONING_EFFORT || undefined

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('aka-sessions')
    compression: none

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.cwd() + '/skills', process.cwd() + '/.agents/skills']"

# AKA owns the foreground wait and excludes authenticated Runtime waits from
# Agent active time. Do not turn a long evaluation into a detached shell job.
- id: tool-bash
  config:
    enableRunInBackground: false
    promoteOnTimeout: false
